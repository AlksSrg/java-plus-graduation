spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - CircuitBreaker=myCircuitBreaker
      routes:
        # Маршруты для user-service
        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          filters:
            - StripPrefix=1

        # Маршруты для category-service
        - id: category-service-admin
          uri: lb://category-service
          predicates:
            - Path=/admin/categories/**
          filters:
            - StripPrefix=1
        - id: category-service-public
          uri: lb://category-service
          predicates:
            - Path=/categories/**

        # Маршруты для event-service
        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**
          filters:
            - StripPrefix=1
        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**
          filters:
            - StripPrefix=1
        - id: event-service-public
          uri: lb://event-service
          predicates:
            - Path=/events/**
          filters:
            - StripPrefix=0

        # Маршруты для request-service (заявки на участие)
        - id: request-service-private
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**
          filters:
            - StripPrefix=1
        - id: request-service-event-owner
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/events/{eventId}/requests/**
          filters:
            - StripPrefix=1

        # Маршруты для compilation-service
        - id: compilation-service-admin
          uri: lb://compilation-service
          predicates:
            - Path=/admin/compilations/**
          filters:
            - StripPrefix=1
        - id: compilation-service-public
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**

        # Маршруты для comment-service
        - id: comment-service-private
          uri: lb://comment-service
          predicates:
            - Path=/users/{userId}/comments/**
          filters:
            - StripPrefix=1
        - id: comment-service-public
          uri: lb://comment-service
          predicates:
            - Path=/events/{eventId}/comments
          filters:
            - StripPrefix=1

        # Маршруты для stats-server
        - id: stats-hit-route
          uri: lb://stats-server
          predicates:
            - Path=/hit
        - id: stats-stats-route
          uri: lb://stats-server
          predicates:
            - Path=/stats/**

resilience4j:
  circuitbreaker:
    instances:
      myCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    ru.practicum: DEBUG