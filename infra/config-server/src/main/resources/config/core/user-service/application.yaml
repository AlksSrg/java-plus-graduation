server:
  port: 0

spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:6547/user_service?currentSchema=user_schema}
    username: ${USER_DB_USER:localuser}
    password: ${USER_DB_PASSWORD:localpass}
  jpa:
    hibernate:
      ddl-auto: none
      format-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: user_schema
        format-sql: true
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.orm.jpa: WARN
    org.springframework.orm.jpa.JpaTransactionManager: WARN
    org.springframework.transaction: WARN
    org.springframework.transaction.interceptor: WARN