server:
  port: 0

spring:
  datasource:
    url: ${ANALYZER_DB_URL:jdbc:postgresql://localhost:6542/analyzer_server?currentSchema=analyzer_schema}
    username: ${ANALYZER_DB_USER:localuser}
    password: ${ANALYZER_DB_PASSWORD:localpass}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: analyzer_schema
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  group-id:
    similarity: analyzer-similarity-group
    actions: analyzer-actions-group
  auto-commit: false
  topics:
    event-similarity: stats.events-similarity.v1
    user-actions: stats.user-actions.v1

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

grpc:
  server:
    port: 0

logging:
  level:
    ru.practicum: DEBUG