syntax = "proto3";

package stats.services;

import "google/protobuf/empty.proto";
import "stats/messages/action/user_action.proto";

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.stats";

/**
 * gRPC сервис для сбора действий пользователей.
 */
service UserActionController {
  /**
   * Принимает действие пользователя и сохраняет его для дальнейшей обработки.
   */
  rpc CollectUserAction(stats.messages.action.UserActionProto) returns (google.protobuf.Empty);
}