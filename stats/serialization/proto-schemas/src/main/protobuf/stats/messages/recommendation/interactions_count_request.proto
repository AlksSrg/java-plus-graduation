syntax = "proto3";

package stats.messages.recommendation;

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.stats.recommendation";

/**
 * Запрос количества взаимодействий для списка мероприятий.
 */
message InteractionsCountRequestProto {
  repeated int64 event_id = 1;   // Список идентификаторов мероприятий
}