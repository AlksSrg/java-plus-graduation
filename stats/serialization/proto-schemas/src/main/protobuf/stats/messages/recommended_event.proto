syntax = "proto3";

package stats.messages;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

message RecommendedEventProto {
    int64 event_id = 1;     // Идентификатор мероприятия
    double score = 2;       // Оценка/коэффициент сходства/количество взаимодействий
}