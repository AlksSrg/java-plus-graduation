syntax = "proto3";

package stats.messages;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

message UserRecommendationsRequestProto {
    int64 user_id = 1;      // Идентификатор пользователя
    sint32 max_results = 2; // Максимальное количество рекомендаций
}