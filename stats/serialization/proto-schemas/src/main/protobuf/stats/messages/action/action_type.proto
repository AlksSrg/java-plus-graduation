syntax = "proto3";

package stats.messages.action;

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.stats.action";

/**
 * Типы действий пользователя с мероприятиями.
 */
enum ActionTypeProto {
  ACTION_VIEW = 0;      // Просмотр мероприятия
  ACTION_REGISTER = 1;  // Регистрация на мероприятии
  ACTION_LIKE = 2;      // Лайк мероприятию
}