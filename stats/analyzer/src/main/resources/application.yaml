spring:
  application:
    name: analyzer
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        use-random-policy: true
        max-interval: 6000

server:
  port: 0

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    metadata-map:
      gRPC-port: ${grpc.server.port}
      service-type: "recommendation-analyzer"
      database: "postgresql"

kafka:
  bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  group-id:
    similarity: analyzer-similarity-group
    actions: analyzer-actions-group
  auto-commit: false
  topics:
    event-similarity: telemetry.similarity.v1
    user-actions: telemetry.actions.v1

logging:
  level:
    ru.practicum: DEBUG
    org.springframework: INFO