spring:
  application:
    name: collector
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        initial-interval: 1000
        max-interval: 6000
        max-attempts: 10

server:
  port: 0

grpc:
  server:
    port: 0

logging:
  level:
    ru.practicum: DEBUG